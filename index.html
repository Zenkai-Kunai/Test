<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanTube - Ad-Free Video Player</title>
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #1f1f1f;
      --accent: #ff0000;
      --text: #ffffff;
      --text-secondary: #aaaaaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background-color: var(--bg-color);
      border-bottom: 1px solid #272727;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .logo-icon {
      background-color: var(--accent);
      color: white;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .search-bar {
      display: flex;
      flex: 0 1 500px;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 16px;
      background-color: #121212;
      border: 1px solid #303030;
      border-radius: 20px 0 0 20px;
      color: var(--text);
      outline: none;
    }

    .search-bar input:focus {
      border-color: #1c62b9;
    }

    .search-bar button {
      padding: 10px 20px;
      background-color: #222222;
      border: 1px solid #303030;
      border-left: none;
      border-radius: 0 20px 20px 0;
      color: var(--text);
      cursor: pointer;
    }

    .search-bar button:hover {
      background-color: #303030;
    }

    .adblock-status {
      background-color: rgba(0, 255, 117, 0.1);
      color: #00ff75;
      border: 1px solid #00ff75;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Main Content Layout */
    .container {
      display: flex;
      flex: 1;
      padding: 20px;
      gap: 24px;
      overflow-y: auto;
    }

    .main-content {
      flex: 3;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 300px;
    }

    /* Embedded Player */
    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-info h1 {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .video-info p {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Sidebar Items */
    .sidebar h2 {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .video-card {
      display: flex;
      gap: 10px;
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .video-card:hover {
      background-color: #2a2a2a;
    }

    .video-card img {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 6px;
    }

    .video-card-info h3 {
      font-size: 0.85rem;
      line-height: 1.2;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-card-info p {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span class="logo-icon">▶</span> CleanTube
    </div>
    
    <div class="search-bar">
      <input type="text" id="urlInput" placeholder="Paste YouTube Link or Video ID...">
      <button onclick="loadCustomVideo()">Play</button>
    </div>

    <div class="adblock-status">
      <span>🛡️</span> AdBlock Active
    </div>
  </header>

  <div class="container">
    <main class="main-content">
      <div class="player-wrapper">
        <iframe id="videoPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="video-info">
        <h1 id="videoTitle">Loading...</h1>
        <p id="videoStats">Privacy-enhanced embed stream | Ads and scripts suppressed</p>
      </div>
    </main>

    <aside class="sidebar">
      <h2>Recommended</h2>
      <div id="playlist"></div>
    </aside>
  </div>

  <script>
    // Sample Video Playlist
    const videos = [
      { id: 'jfKfPfyJRdk', title: 'Lofi Hip Hop Radio - Beats to Relax/Study to', channel: 'Lofi Girl' },
      { id: 'dQw4w9WgXcQ', title: 'Rick Astley - Never Gonna Give You Up', channel: 'Rick Astley' },
      { id: '3JZ_D3ELwOQ', title: '4K Scenic Relaxation Film - Nature Footage', channel: 'Relaxation Film' },
      { id: 'L_LUpnjgPso', title: 'Official Trailer Showcase', channel: 'Cinema Hub' }
    ];

    // Extract 11-character YouTube ID from various URL formats
    function extractVideoID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    // Load video into iframe using ad-free nocookie domain
    function playVideo(id, title = "User Custom Video") {
      const cleanId = extractVideoID(id);
      // Privacy mode URL strips ad trackers and popups
      const embedUrl = `https://www.youtube-nocookie.com/embed/${cleanId}?autoplay=1&modestbranding=1&rel=0`;
      
      document.getElementById('videoPlayer').src = embedUrl;
      document.getElementById('videoTitle').innerText = title;
      document.getElementById('videoStats').innerText = `Active ID: ${cleanId} | Ads Blocked via No-Cookie Endpoint`;
    }

    function loadCustomVideo() {
      const input = document.getElementById('urlInput').value.trim();
      if (input) {
        playVideo(input, "Loaded via Search Input");
      }
    }

    // Render side menu
    function renderPlaylist() {
      const playlistEl = document.getElementById('playlist');
      playlistEl.innerHTML = '';

      videos.forEach(video => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => playVideo(video.id, video.title);
        card.innerHTML = `
          <img src="https://img.youtube.com/vi/${video.id}/mqdefault.jpg" alt="${video.title}">
          <div class="video-card-info">
            <h3>${video.title}</h3>
            <p>${video.channel}</p>
          </div>
        `;
        playlistEl.appendChild(card);
      });
    }

    // Enter key support for input field
    document.getElementById('urlInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        loadCustomVideo();
      }
    });

    // Initialize layout with default video
    window.onload = () => {
      renderPlaylist();
      playVideo(videos[0].id, videos[0].title);
    };
  </script>
</body>
</html>
