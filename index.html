<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Anti-Jam Routing App</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
    .control-card {
      position: absolute; top: 15px; right: 15px; z-index: 1000;
      background: #ffffff; padding: 15px 20px; border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 220px;
    }
    .toggle-container { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; transition: .3s; border-radius: 22px;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #e74c3c; }
    input:checked + .slider:before { transform: translateX(22px); }
    button {
      margin-top: 12px; width: 100%; padding: 8px; background: #333; color: white;
      border: none; border-radius: 4px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="control-card">
    <h4 style="margin:0 0 10px 0;">Route Settings</h4>
    <div class="toggle-container">
      <span><strong>Anti-Jam</strong></span>
      <label class="switch">
        <input type="checkbox" id="antiJamToggle">
        <span class="slider"></span>
      </label>
    </div>
    <div id="statusText" style="font-size: 12px; margin-top: 8px; color: #666;">
      Status: Standard Fastest Route
    </div>
    <button onclick="resetMap()">Reset Pins</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Replace with your Mapbox Access Token (Free at mapbox.com)
    const MAPBOX_TOKEN = 'YOUR_MAPBOX_ACCESS_TOKEN';

    const map = L.map('map').setView([3.1390, 101.6869], 13); // Default to city center
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let startPin = null;
    let destPin = null;
    let currentRouteLine = null;

    // Handle map clicks to drop Start & Destination pins
    map.on('click', function(e) {
      if (!startPin) {
        startPin = L.marker(e.latlng, { title: "Start" }).addTo(map).bindPopup("Start Location").openPopup();
      } else if (!destPin) {
        destPin = L.marker(e.latlng, { title: "Destination" }).addTo(map).bindPopup("Destination").openPopup();
        calculateRoute();
      }
    });

    // Toggle switch listener
    const toggle = document.getElementById('antiJamToggle');
    const statusText = document.getElementById('statusText');

    toggle.addEventListener('change', () => {
      statusText.innerText = toggle.checked 
        ? "Status: Avoiding Jams (Live Traffic)" 
        : "Status: Standard Shortest Route";
      if (startPin && destPin) calculateRoute();
    });

    function calculateRoute() {
      const isAntiJam = toggle.checked;
      
      // Mapbox Profiles:
      // 'driving' = Shortest / Standard fastest without live jam avoidance
      // 'driving-traffic' = Dynamically reroutes to completely avoid congested roads
      const profile = isAntiJam ? 'driving-traffic' : 'driving';

      const startCoords = `${startPin.getLatLng().lng},${startPin.getLatLng().lat}`;
      const destCoords = `${destPin.getLatLng().lng},${destPin.getLatLng().lat}`;
      
      const url = `https://api.mapbox.com/directions/v5/mapbox/${profile}/${startCoords};${destCoords}?geometries=geojson&access_token=${MAPBOX_TOKEN}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data.routes || data.routes.length === 0) return alert("Route not found!");
          
          if (currentRouteLine) map.removeLayer(currentRouteLine);

          const routeCoordinates = data.routes[0].geometry;
          
          // Draw the polyline (Red for Anti-Jam route, Blue for standard)
          currentRouteLine = L.geoJSON(routeCoordinates, {
            style: {
              color: isAntiJam ? '#e74c3c' : '#3498db',
              weight: 6,
              opacity: 0.8
            }
          }).addTo(map);

          map.fitBounds(currentRouteLine.getBounds(), { padding: [50, 50] });
        })
        .catch(err => console.error("Routing error:", err));
    }

    function resetMap() {
      if (startPin) map.removeLayer(startPin);
      if (destPin) map.removeLayer(destPin);
      if (currentRouteLine) map.removeLayer(currentRouteLine);
      startPin = null;
      destPin = null;
      currentRouteLine = null;
    }
  </script>
</body>
</html>
