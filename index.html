<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ProTrader Web Studio</title>
  <style>
    :root {
      --bg-main: #131722;
      --bg-panel: #1e222d;
      --border-color: #2a2e39;
      --text-main: #d1d4dc;
      --text-muted: #787b86;
      --green: #089981;
      --red: #f23645;
      --accent: #2962ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    /* Header Bar */
    header { height: 48px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 16px; justify-content: space-between; }
    .symbol-title { font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .symbol-price { font-family: monospace; font-size: 16px; }
    
    /* Layout Workspace */
    .workspace { display: flex; flex: 1; height: calc(100vh - 48px); }
    .chart-section { flex: 1; display: flex; flex-direction: column; position: relative; }
    #trading-chart { flex: 1; width: 100%; height: 100%; display: block; }
    
    /* Script Editor Side Panel */
    .side-panel { width: 340px; background: var(--bg-panel); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .panel-header { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 13px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
    
    .editor-container { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    textarea { flex: 1; background: #131722; border: 1px solid var(--border-color); color: #00e676; padding: 10px; font-family: monospace; font-size: 12px; border-radius: 4px; resize: none; outline: none; }
    
    /* Order Entry Panel */
    .order-panel { padding: 12px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
    .btn-row { display: flex; gap: 8px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s opacity; }
    button:hover { opacity: 0.85; }
    .btn-buy { background: var(--green); }
    .btn-sell { background: var(--red); }
    .btn-apply { background: var(--accent); margin-top: 4px; }
    
    /* Status Overlay */
    .log-output { height: 70px; background: #131722; border: 1px solid var(--border-color); font-family: monospace; font-size: 11px; padding: 6px; color: var(--text-muted); overflow-y: auto; }
  </style>
</head>
<body>

  <header>
    <div class="symbol-title">
      <span>BTC/USD</span>
      <span class="symbol-price" id="live-price" style="color: var(--green);">45,000.00</span>
    </div>
    <div style="font-size: 12px; color: var(--text-muted);">Status: <span style="color: var(--green);">● Live Sandbox</span></div>
  </header>

  <div class="workspace">
    <!-- Main Chart Window -->
    <div class="chart-section">
      <canvas id="trading-chart"></canvas>
    </div>

    <!-- Right Control & Indicator Editor Dock -->
    <div class="side-panel">
      <div class="panel-header">Custom Script Engine</div>
      <div class="editor-container">
        <textarea id="script-editor" spellcheck="false">// Built-in Indicator Engine
// SMA(period, color) or EMA(period, color)
SMA(10, #ffeb3b)
EMA(20, #00e5ff)</textarea>
        <button class="btn-apply" onclick="compileAndRunScript()">Execute Script</button>
        <div class="log-output" id="console-log">> System ready.</div>
      </div>

      <div class="panel-header">Quick Order Terminal</div>
      <div class="order-panel">
        <div class="btn-row">
          <button class="btn-buy" onclick="logTrade('BUY')">BUY / LONG</button>
          <button class="btn-sell" onclick="logTrade('SELL')">SELL / SHORT</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Data Model & State ---
    const canvas = document.getElementById('trading-chart');
    const ctx = canvas.getContext('2d');
    const priceEl = document.getElementById('live-price');
    const consoleLog = document.getElementById('console-log');

    let candles = [];
    let indicatorsToRender = [];
    const maxCandles = 60;

    // Generate Initial Historical Candle Data
    function generateHistory() {
      let basePrice = 44500;
      let now = Date.now();
      for (let i = 0; i < maxCandles; i++) {
        let close = basePrice + (Math.random() - 0.48) * 150;
        let open = basePrice;
        let high = Math.max(open, close) + Math.random() * 50;
        let low = Math.min(open, close) - Math.random() * 50;
        candles.push({ open, high, low, close });
        basePrice = close;
      }
    }

    // --- High Performance Canvas Rendering Engine ---
    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      renderChart();
    }
    window.addEventListener('resize', resizeCanvas);

    function renderChart() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const padding = 40;
      const chartWidth = canvas.width - padding;
      const chartHeight = canvas.height - padding;

      // Calculate Scale Bounds
      let minP = Math.min(...candles.map(c => c.low));
      let maxP = Math.max(...candles.map(c => c.high));
      const range = maxP - minP || 1;

      const candleWidth = chartWidth / maxCandles;

      // Draw Grid Lines
      ctx.strokeStyle = '#2a2e39';
      ctx.lineWidth = 1;
      for (let i = 1; i < 5; i++) {
        let y = (chartHeight / 5) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(chartWidth, y);
        ctx.stroke();
      }

      // Render Candlesticks
      candles.forEach((c, idx) => {
        const x = idx * candleWidth + candleWidth / 2;
        const openY = chartHeight - ((c.open - minP) / range) * chartHeight;
        const closeY = chartHeight - ((c.close - minP) / range) * chartHeight;
        const highY = chartHeight - ((c.high - minP) / range) * chartHeight;
        const lowY = chartHeight - ((c.low - minP) / range) * chartHeight;

        const isGreen = c.close >= c.open;
        ctx.strokeStyle = isGreen ? '#089981' : '#f23645';
        ctx.fillStyle = isGreen ? '#089981' : '#f23645';

        // High/Low Wick Line
        ctx.beginPath();
        ctx.moveTo(x, highY);
        ctx.lineTo(x, lowY);
        ctx.stroke();

        // Open/Close Candle Body
        const bodyY = Math.min(openY, closeY);
        const bodyHeight = Math.max(Math.abs(closeY - openY), 2);
        ctx.fillRect(x - candleWidth * 0.3, bodyY, candleWidth * 0.6, bodyHeight);
      });

      // Render Overlay Custom Indicators
      indicatorsToRender.forEach(ind => {
        ctx.strokeStyle = ind.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        
        ind.values.forEach((val, idx) => {
          if (val === null) return;
          const x = idx * candleWidth + candleWidth / 2;
          const y = chartHeight - ((val - minP) / range) * chartHeight;
          if (idx === 0 || ind.values[idx - 1] === null) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        });
        ctx.stroke();
      });
    }

    // --- Script Parsing & Technical Indicator Calculation ---
    function compileAndRunScript() {
      const script = document.getElementById('script-editor').value;
      indicatorsToRender = [];
      
      const lines = script.split('\n');
      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('//') || !line) return;

        // Simple Regex Parser for Indicator Syntax: NAME(period, color)
        const match = line.match(/(SMA|EMA)\((\d+),\s*(#[a-fA-F0-9]{3,6}|[a-z]+)\)/i);
        if (match) {
          const type = match[1].toUpperCase();
          const period = parseInt(match[2]);
          const color = match[3];

          let values = [];
          if (type === 'SMA') values = calculateSMA(period);
          if (type === 'EMA') values = calculateEMA(period);

          indicatorsToRender.push({ color, values });
          writeConsole(`> Loaded ${type}(${period}) Indicator.`);
        } else {
          writeConsole(`> Syntax Error: "${line}"`, true);
        }
      });

      renderChart();
    }

    function calculateSMA(period) {
      return candles.map((_, idx, arr) => {
        if (idx < period - 1) return null;
        let sum = 0;
        for (let i = 0; i < period; i++) sum += arr[idx - i].close;
        return sum / period;
      });
    }

    function calculateEMA(period) {
      const k = 2 / (period + 1);
      let prevEma = null;
      return candles.map((c, idx) => {
        if (idx < period - 1) return null;
        if (prevEma === null) {
          let sum = 0;
          for (let i = 0; i < period; i++) sum += candles[idx - i].close;
          prevEma = sum / period;
          return prevEma;
        }
        prevEma = c.close * k + prevEma * (1 - k);
        return prevEma;
      });
    }

    // --- Live Tick Simulation & Event Logging ---
    function startLiveStream() {
      setInterval(() => {
        let lastCandle = candles[candles.length - 1];
        let change = (Math.random() - 0.49) * 20;
        let newClose = lastCandle.close + change;

        lastCandle.close = newClose;
        lastCandle.high = Math.max(lastCandle.high, newClose);
        lastCandle.low = Math.min(lastCandle.low, newClose);

        priceEl.textContent = newClose.toFixed(2);
        priceEl.style.color = change >= 0 ? 'var(--green)' : 'var(--red)';

        compileAndRunScript();
      }, 800);
    }

    function writeConsole(msg, isErr = false) {
      consoleLog.innerHTML += `<div style="color:${isErr ? '#f23645' : '#787b86'}">${msg}</div>`;
      consoleLog.scrollTop = consoleLog.scrollHeight;
    }

    function logTrade(side) {
      let price = candles[candles.length - 1].close.toFixed(2);
      writeConsole(`> Executed ${side} order @ $${price}`);
    }

    // Initialization Sequence
    generateHistory();
    setTimeout(() => {
      resizeCanvas();
      compileAndRunScript();
      startLiveStream();
    }, 100);
  </script>
</body>
</html>
