<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fast Vector Traffic App</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100vh; width: 100%; background: #222; }
    
    .control-card {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: #ffffff; padding: 16px; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 280px;
    }
    .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-box input {
      flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none;
    }
    .search-box button {
      padding: 8px 12px; background: #007aff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .suggestions {
      background: #fff; border: 1px solid #eee; border-radius: 6px; max-height: 150px; overflow-y: auto; margin-bottom: 10px; display: none;
    }
    .suggestion-item { padding: 8px 10px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
    .suggestion-item:hover { background: #f5f5f5; }
    
    .toggle-container { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; transition: .3s; border-radius: 22px;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #ff3b30; }
    input:checked + .slider:before { transform: translateX(22px); }
    
    #statusText { font-size: 12px; margin-top: 8px; color: #666; font-weight: 500; }
  </style>
</head>
<body>

  <div class="control-card">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search destination..." />
      <button onclick="searchPlace()">Go</button>
    </div>
    <div id="suggestions" class="suggestions"></div>

    <div class="toggle-container">
      <span><strong>Anti-Jam Routing</strong></span>
      <label class="switch">
        <input type="checkbox" id="antiJamToggle">
        <span class="slider"></span>
      </label>
    </div>
    <div id="statusText">Status: Standard Fastest Route</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script>
    // Replace with your Mapbox Token (free tier at mapbox.com)
    const MAPBOX_TOKEN = 'YOUR_MAPBOX_ACCESS_TOKEN';

    let userCoords = [101.6869, 3.1390]; // Default center fallback
    let destCoords = null;
    let startMarker = null;
    let destMarker = null;

    // WebGL GPU-Accelerated Map Initialization (High-speed rendering)
    const map = new maplibregl.Map({
      container: 'map',
      style: `https://api.maptiler.com/maps/basic-v2/style.json?key=get_your_own_OpenStreetMap_key`, // Or use standard vector tile styles
      style: {
        'version': 8,
        'sources': {
          'raster-tiles': {
            'type': 'raster',
            'tiles': ['https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png'],
            'tileSize': 256
          }
        },
        'layers': [{ 'id': 'simple-tiles', 'type': 'raster', 'source': 'raster-tiles', 'minzoom': 0, 'maxzoom': 19 }]
      },
      center: userCoords,
      zoom: 14,
      fadeDuration: 0 // Disables tile fade-in delays for ultra-fast rendering
    });

    // Fetch User's Real-Time Location
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userCoords = [pos.coords.longitude, pos.coords.latitude];
          map.flyTo({ center: userCoords, zoom: 15, speed: 2 });

          startMarker = new maplibregl.Marker({ color: '#007aff' })
            .setLngLat(userCoords)
            .setPopup(new maplibregl.Popup().setText("Your Location"))
            .addTo(map);
        },
        () => console.warn("Geolocation permission denied, using default center.")
      );
    }

    // Geocoding Search Logic (Mapbox Geocoding API)
    async function searchPlace() {
      const query = document.getElementById('searchInput').value;
      if (!query) return;

      const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${MAPBOX_TOKEN}&proximity=${userCoords[0]},${userCoords[1]}`;
      
      const res = await fetch(url);
      const data = await res.json();
      
      if (data.features && data.features.length > 0) {
        const place = data.features[0];
        setDestination(place.center[0], place.center[1], place.text);
      } else {
        alert("Destination not found.");
      }
    }

    function setDestination(lng, lat, name) {
      destCoords = [lng, lat];

      if (destMarker) destMarker.remove();
      destMarker = new maplibregl.Marker({ color: '#ff3b30' })
        .setLngLat(destCoords)
        .setPopup(new maplibregl.Popup().setText(name || "Destination"))
        .addTo(map);

      calculateRoute();
    }

    // Anti-Jam Toggle Listener
    const toggle = document.getElementById('antiJamToggle');
    const statusText = document.getElementById('statusText');

    toggle.addEventListener('change', () => {
      statusText.innerText = toggle.checked 
        ? "Status: Avoiding Jams (Live Traffic)" 
        : "Status: Standard Shortest Route";
      if (destCoords) calculateRoute();
    });

    // Dynamic Route Calculation
    async function calculateRoute() {
      if (!destCoords) return;

      const profile = toggle.checked ? 'driving-traffic' : 'driving';
      const url = `https://api.mapbox.com/directions/v5/mapbox/${profile}/${userCoords[0]},${userCoords[1]};${destCoords[0]},${destCoords[1]}?geometries=geojson&access_token=${MAPBOX_TOKEN}`;

      const res = await fetch(url);
      const data = await res.json();

      if (!data.routes || data.routes.length === 0) return;

      const routeGeoJSON = {
        'type': 'Feature',
        'properties': {},
        'geometry': data.routes[0].geometry
      };

      // Add or Update WebGL GPU Layer
      if (map.getSource('route')) {
        map.getSource('route').setData(routeGeoJSON);
        map.setPaintProperty('route-line', 'line-color', toggle.checked ? '#ff3b30' : '#007aff');
      } else {
        map.addSource('route', { 'type': 'geojson', 'data': routeGeoJSON });
        map.addLayer({
          'id': 'route-line',
          'type': 'line',
          'source': 'route',
          'layout': { 'line-join': 'round', 'line-cap': 'round' },
          'paint': {
            'line-color': toggle.checked ? '#ff3b30' : '#007aff',
            'line-width': 6,
            'line-opacity': 0.85
          }
        });
      }

      // Auto-fit screen bounds around the route
      const coordinates = data.routes[0].geometry.coordinates;
      const bounds = coordinates.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));
      map.fitBounds(bounds, { padding: 80 });
    }
  </script>
</body>
</html>
