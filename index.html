<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orthogonal Schematic Visualizer</title>
    <style>
        :root {
            --bg: #ffffff;
            --grid: #f1f5f9;
            --text: #1e293b;
        }
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            padding: 15px;
            background: white;
            border-bottom: 1px solid #ccc;
            z-index: 10;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button, input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            cursor: grab;
            overflow: hidden;
            background-color: var(--bg);
            /* Schematic Grid Background */
            background-image: 
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        #canvas-container:active { cursor: grabbing; }
        svg { width: 100%; height: 100%; display: block; }
        
        /* Schematic Styles */
        .wire { stroke: #0056b3; stroke-width: 1.5px; fill: none; stroke-linejoin: round; }
        .label { font-size: 10px; fill: #000; font-family: monospace; pointer-events: none; text-anchor: middle;}
        .net-node { fill: #0056b3; }
        .sym-stroke { stroke: #000; stroke-width: 1.5px; fill: none; stroke-linejoin: round;}
        .ic-box { fill: #fff; stroke: #000; stroke-width: 1.5px; }
        
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: white;
            padding: 10px 20px; border-radius: 8px; display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0;">Orthogonal Schematic Generator</h2>
        <p style="margin:5px 0 0 0; font-size:14px; color:#666;">Lines are routed at 90-degree angles and components snap to grid.</p>
        <div class="controls">
            <input type="file" id="fileInput" accept=".txt,.board,*/*" />
            <button onclick="generateDiagram()">Process Layout</button>
            <button onclick="resetView()" style="background: #475569;">Center View</button>
        </div>
    </div>

    <div id="canvas-container">
        <svg id="circuitSvg">
            <defs>
                <!-- Standard Schematic Symbols -->
                <g id="sym-R" transform="translate(-15, -5)">
                    <path d="M 0,5 L 5,5 L 7,0 L 11,10 L 15,0 L 19,10 L 23,0 L 25,5 L 30,5" class="sym-stroke"/>
                </g>
                <g id="sym-C" transform="translate(-10, -10)">
                    <line x1="0" y1="10" x2="8" y2="10" class="sym-stroke" />
                    <line x1="8" y1="2" x2="8" y2="18" class="sym-stroke" />
                    <line x1="12" y1="2" x2="12" y2="18" class="sym-stroke" />
                    <line x1="12" y1="10" x2="20" y2="10" class="sym-stroke" />
                </g>
                <g id="sym-U" transform="translate(-20, -20)">
                    <rect x="0" y="0" width="40" height="40" class="ic-box" />
                </g>
            </defs>
            <g id="viewport" transform="translate(0,0) scale(1)"></g>
        </svg>
        <div id="loading">Calculating Grid Layout...</div>
    </div>

    <script>
        let nodes = [];
        let edges = [];
        const VIRTUAL_WIDTH = 6000;
        const VIRTUAL_HEIGHT = 6000;
        const GRID_SIZE = 40; // Snap size

        let currentScale = 1, currentX = 0, currentY = 0;
        let isDragging = false, startDragX = 0, startDragY = 0;

        function getComponentType(id) {
            id = id.toUpperCase();
            if (id.startsWith('R')) return 'R';
            if (id.startsWith('C')) return 'C';
            return 'U'; 
        }

        function parseBoardFile(text) {
            nodes = []; edges = [];
            const nodeMap = new Map();

            function addNode(id, isNet) {
                if (!nodeMap.has(id)) {
                    const node = { 
                        id: id, isNet: isNet, compType: isNet ? 'NET' : getComponentType(id),
                        x: (VIRTUAL_WIDTH/2) + (Math.random() - 0.5) * 2000, 
                        y: (VIRTUAL_HEIGHT/2) + (Math.random() - 0.5) * 2000, 
                        vx: 0, vy: 0 
                    };
                    nodes.push(node);
                    nodeMap.set(id, node);
                }
                return nodeMap.get(id);
            }

            const connSection = text.split(/CONNECTIONS/i)[1];
            if (!connSection) return false;
            
            const connectionsText = connSection.split(/(DEVICES|END)/i)[0];
            const lines = connectionsText.split('\n');
            let currentNet = null;

            lines.forEach(line => {
                let cleanLine = line.split('!')[0].trimRight();
                if (!cleanLine.trim()) return;
                const leadingSpaces = cleanLine.length - cleanLine.trimLeft().length;
                
                if (leadingSpaces < 4 && cleanLine.trim() !== '') {
                    currentNet = cleanLine.trim();
                    addNode(currentNet, true);
                } else if (leadingSpaces >= 4 && currentNet) {
                    let componentPart = cleanLine.trim().split('.')[0].replace(';', '');
                    if (componentPart) {
                        addNode(componentPart, false);
                        edges.push({ source: currentNet, target: componentPart });
                    }
                }
            });
            return true;
        }

        function generateDiagram() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return;
            document.getElementById('loading').style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(e) {
                setTimeout(() => {
                    if (parseBoardFile(e.target.result)) {
                        runPhysicsLayout();
                        renderSVG();
                        resetView();
                    }
                    document.getElementById('loading').style.display = 'none';
                }, 50);
            };
            reader.readAsText(fileInput.files[0]);
        }

        function runPhysicsLayout() {
            const iterations = 300; 
            const k = 120; 
            const nodeDict = {};
            nodes.forEach(n => nodeDict[n.id] = n);

            for (let iter = 0; iter < iterations; iter++) {
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        let dx = nodes[i].x - nodes[j].x;
                        let dy = nodes[i].y - nodes[j].y;
                        let distSq = dx*dx + dy*dy;
                        if (distSq === 0) distSq = 0.01;
                        if (distSq < 90000) { 
                            let force = (k * k) / distSq;
                            nodes[i].vx += force * dx; nodes[i].vy += force * dy;
                            nodes[j].vx -= force * dx; nodes[j].vy -= force * dy;
                        }
                    }
                }

                edges.forEach(edge => {
                    let source = nodeDict[edge.source], target = nodeDict[edge.target];
                    if(!source || !target) return;
                    let dx = target.x - source.x, dy = target.y - source.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist === 0) dist = 0.01;
                    
                    let force = (dist * dist) / k;
                    let fx = (force * dx) / dist, fy = (force * dy) / dist;
                    
                    source.vx += fx; source.vy += fy;
                    target.vx -= fx; target.vy -= fy;
                });

                const temp = (1 - iter / iterations) * 50; 
                nodes.forEach(n => {
                    let vDist = Math.sqrt(n.vx*n.vx + n.vy*n.vy);
                    if (vDist > 0) {
                        n.x += (n.vx / vDist) * Math.min(vDist, temp);
                        n.y += (n.vy / vDist) * Math.min(vDist, temp);
                    }
                    n.vx = 0; n.vy = 0;
                });
            }

            // SNAP TO GRID
            nodes.forEach(n => {
                n.x = Math.round(n.x / GRID_SIZE) * GRID_SIZE;
                n.y = Math.round(n.y / GRID_SIZE) * GRID_SIZE;
            });
        }

        function renderSVG() {
            const viewport = document.getElementById('viewport');
            viewport.innerHTML = '';
            const nodeDict = {};
            nodes.forEach(n => nodeDict[n.id] = n);

            // Draw Manhattan Orthogonal Wires
            edges.forEach(edge => {
                let source = nodeDict[edge.source], target = nodeDict[edge.target];
                if(source && target) {
                    let path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    let midX = (source.x + target.x) / 2;
                    // Snap mid point to grid
                    midX = Math.round(midX / GRID_SIZE) * GRID_SIZE;
                    
                    // Manhattan routing data
                    let d = `M ${source.x} ${source.y} L ${midX} ${source.y} L ${midX} ${target.y} L ${target.x} ${target.y}`;
                    path.setAttribute('d', d);
                    path.setAttribute('class', 'wire');
                    viewport.appendChild(path);
                }
            });

            // Draw Nodes & Labels
            nodes.forEach(n => {
                if (n.isNet) {
                    let circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y);
                    circle.setAttribute('r', 4); circle.setAttribute('class', 'net-node');
                    viewport.appendChild(circle);
                } else {
                    let use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
                    use.setAttribute('href', '#sym-' + n.compType);
                    use.setAttribute('x', n.x); use.setAttribute('y', n.y);
                    viewport.appendChild(use);
                }

                let text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', n.x);
                text.setAttribute('y', n.y + (n.compType === 'U' ? 30 : 20));
                text.setAttribute('class', 'label');
                text.textContent = n.id;
                viewport.appendChild(text);
            });
        }

        // Viewport Controls (Pan & Zoom)
        function updateTransform() {
            document.getElementById('viewport').setAttribute('transform', `translate(${currentX}, ${currentY}) scale(${currentScale})`);
            // Parallax grid effect
            document.getElementById('canvas-container').style.backgroundPosition = `${currentX}px ${currentY}px`;
            document.getElementById('canvas-container').style.backgroundSize = `${20 * currentScale}px ${20 * currentScale}px`;
        }

        function resetView() {
            const container = document.getElementById('canvas-container');
            currentScale = 0.5;
            currentX = -(VIRTUAL_WIDTH/2 * currentScale) + (container.clientWidth/2);
            currentY = -(VIRTUAL_HEIGHT/2 * currentScale) + (container.clientHeight/2);
            updateTransform();
        }

        const container = document.getElementById('canvas-container');
        container.addEventListener('mousedown', e => { isDragging = true; startDragX = e.clientX - currentX; startDragY = e.clientY - currentY; });
        window.addEventListener('mousemove', e => { if (isDragging) { currentX = e.clientX - startDragX; currentY = e.clientY - startDragY; updateTransform(); }});
        window.addEventListener('mouseup', () => isDragging = false);

        container.addEventListener('wheel', e => {
            e.preventDefault();
            const delta = -e.deltaY * 0.001;
            const newScale = Math.max(0.1, Math.min(3, currentScale + delta));
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
            currentX = mouseX - (mouseX - currentX) * (newScale / currentScale);
            currentY = mouseY - (mouseY - currentY) * (newScale / currentScale);
            currentScale = newScale;
            updateTransform();
        });
    </script>
</body>
</html>
