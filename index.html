<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile 3D Studio & LiDAR Importer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        
        /* Layout Structure */
        #app-container {
            display: flex;
            flex-direction: row;
            height: 100%;
            width: 100%;
            position: relative;
        }

        #viewport {
            flex-grow: 1;
            height: 100%;
            position: relative;
            background: #121212;
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Sidebar / Bottom Sheet */
        #sidebar {
            width: 320px;
            background-color: #242424;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            overflow-y: auto;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .panel-section {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
        }

        .panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #3b82f6;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }
        .control-group:last-child { margin-bottom: 0; }

        label {
            font-size: 12px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }

        input, select, button {
            background-color: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            min-height: 40px; /* Mobile touch friendly target */
        }

        input[type="color"] {
            padding: 2px;
            height: 40px;
            width: 100%;
            cursor: pointer;
        }

        input[type="range"] {
            -webkit-appearance: none;
            background: #333;
            height: 8px;
            border-radius: 4px;
            border: none;
            min-height: 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }

        button {
            background-color: #2563eb;
            cursor: pointer;
            font-weight: 600;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        button:active { opacity: 0.8; }
        button.danger { background-color: #dc2626; }
        button.success { background-color: #16a34a; }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        /* Toolbar overlay */
        #toolbar {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(36, 36, 36, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #444;
            padding: 4px;
            border-radius: 8px;
            display: flex;
            gap: 4px;
            z-index: 5;
        }

        .tool-btn {
            min-height: 36px;
            padding: 6px 12px;
            background: transparent;
            border: 1px solid transparent;
            font-size: 12px;
        }

        .tool-btn.active {
            background-color: #2563eb;
            border-color: #60a5fa;
        }

        #mobile-toggle {
            display: none;
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 20;
            background: #2563eb;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            #app-container {
                flex-direction: column;
            }
            #mobile-toggle {
                display: block;
            }
            #sidebar {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                max-height: 60vh;
                border-left: none;
                border-top: 1px solid #444;
                border-radius: 16px 16px 0 0;
                box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
                transform: translateY(100%);
            }
            #sidebar.open {
                transform: translateY(0);
            }
        }
    </style>
    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
</head>
<body>

    <div id="app-container">
        <button id="mobile-toggle" onclick="toggleSidebar()">⚙️ Inspector</button>

        <div id="viewport">
            <div id="toolbar">
                <button class="tool-btn active" id="mode-translate" onclick="setTransformMode('translate')">Move</button>
                <button class="tool-btn" id="mode-rotate" onclick="setTransformMode('rotate')">Rotate</button>
                <button class="tool-btn" id="mode-scale" onclick="setTransformMode('scale')">Scale</button>
            </div>
            <canvas id="canvas3d"></canvas>
        </div>

        <div id="sidebar">
            <!-- 3D Scan / Import Section -->
            <div class="panel-section">
                <div class="panel-title">Import LiDAR Scan / 3D File</div>
                <div class="control-group">
                    <input type="file" id="file-input" accept=".obj,.stl" style="display: none;" onchange="handleFileUpload(event)">
                    <button class="success" onclick="document.getElementById('file-input').click()">📁 Load .OBJ or .STL Scan</button>
                </div>
            </div>

            <!-- Add Standard Geometries -->
            <div class="panel-section">
                <div class="panel-title">Add Primitives</div>
                <div class="btn-grid">
                    <button onclick="addCube()">Cube</button>
                    <button onclick="addSphere()">Sphere</button>
                    <button onclick="addCylinder()">Cylinder</button>
                    <button onclick="addTorus()">Torus</button>
                </div>
            </div>

            <!-- Material Properties -->
            <div class="panel-section">
                <div class="panel-title">Material</div>
                <div class="control-group">
                    <label>Color</label>
                    <input type="color" id="mat-color" value="#2563eb" onchange="updateMaterial()">
                </div>
                <div class="control-group">
                    <label>Roughness <span id="val-roughness">0.4</span></label>
                    <input type="range" id="mat-roughness" min="0" max="1" step="0.05" value="0.4" oninput="updateMaterial()">
                </div>
                <div class="control-group">
                    <label>Metalness <span id="val-metalness">0.2</span></label>
                    <input type="range" id="mat-metalness" min="0" max="1" step="0.05" value="0.2" oninput="updateMaterial()">
                </div>
            </div>

            <!-- Actions -->
            <div class="panel-section">
                <div class="panel-title">Object Actions</div>
                <div class="btn-grid">
                    <button onclick="duplicateSelected()">Duplicate</button>
                    <button class="danger" onclick="deleteSelected()">Delete</button>
                </div>
            </div>

            <!-- Exporter Section -->
            <div class="panel-section">
                <div class="panel-title">Export Model</div>
                <div class="control-group">
                    <label>Format</label>
                    <select id="export-format">
                        <option value="glb">GLB (Binary GLTF)</option>
                        <option value="obj">OBJ (Wavefront)</option>
                        <option value="stl">STL (3D Print)</option>
                    </select>
                </div>
                <button onclick="exportDesign()">Download File</button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, orbitControls, transformControls;
        let selectedObject = null;
        const objects = [];

        init();
        animate();

        function init() {
            const viewport = document.getElementById('viewport');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);

            const gridHelper = new THREE.GridHelper(30, 30, 0x2563eb, 0x333333);
            scene.add(gridHelper);

            camera = new THREE.PerspectiveCamera(60, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
            camera.position.set(4, 4, 6);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Lighting setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            // Orbit Controls with Touch support enabled
            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.05;

            // Transform Gizmos
            transformControls = new THREE.TransformControls(camera, renderer.domElement);
            transformControls.size = 0.75;
            scene.add(transformControls);

            transformControls.addEventListener('dragging-changed', (e) => {
                orbitControls.enabled = !e.value;
            });

            // Touch & Pointer Raycaster for Selection
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            renderer.domElement.addEventListener('pointerdown', (event) => {
                if (transformControls.dragging) return;

                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(objects, true);

                if (intersects.length > 0) {
                    let rootObj = intersects[0].object;
                    while (rootObj.parent && rootObj.parent !== scene) {
                        rootObj = rootObj.parent;
                    }
                    selectObject(rootObj);
                }
            });

            window.addEventListener('resize', onWindowResize);
            addCube();
        }

        // --- File Reader / LiDAR Scan Importer ---
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const filename = file.name.toLowerCase();
            const reader = new FileReader();

            if (filename.endsWith('.obj')) {
                reader.onload = function (e) {
                    const loader = new THREE.OBJLoader();
                    const obj = loader.parse(e.target.result);
                    setupImportedMesh(obj);
                };
                reader.readAsText(file);
            } else if (filename.endsWith('.stl')) {
                reader.onload = function (e) {
                    const loader = new THREE.STLLoader();
                    const geometry = loader.parse(e.target.result);
                    const material = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.4 });
                    const mesh = new THREE.Mesh(geometry, material);
                    setupImportedMesh(mesh);
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function setupImportedMesh(object) {
            // Auto-center and normalize size
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            object.position.sub(center); // Center geometry origin
            object.position.y += size.y / 2; // Place on grid floor

            scene.add(object);
            objects.push(object);
            selectObject(object);
        }

        // --- Creation Suite ---
        function createMesh(geometry) {
            const material = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.4, metalness: 0.2 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.y = 1;
            scene.add(mesh);
            objects.push(mesh);
            selectObject(mesh);
        }

        function addCube() { createMesh(new THREE.BoxGeometry(1.5, 1.5, 1.5)); }
        function addSphere() { createMesh(new THREE.SphereGeometry(1, 32, 32)); }
        function addCylinder() { createMesh(new THREE.CylinderGeometry(1, 1, 2, 32)); }
        function addTorus() { createMesh(new THREE.TorusGeometry(1, 0.4, 16, 100)); }

        // --- Core UI & Selection Logic ---
        function selectObject(obj) {
            selectedObject = obj;
            if (obj) transformControls.attach(obj);
            else transformControls.detach();
        }

        function setTransformMode(mode) {
            transformControls.setMode(mode);
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
        }

        function duplicateSelected() {
            if (!selectedObject) return;
            const clone = selectedObject.clone(true);
            clone.position.add(new THREE.Vector3(0.5, 0, 0.5));
            scene.add(clone);
            objects.push(clone);
            selectObject(clone);
        }

        function deleteSelected() {
            if (!selectedObject) return;
            transformControls.detach();
            scene.remove(selectedObject);
            const index = objects.indexOf(selectedObject);
            if (index > -1) objects.splice(index, 1);
            selectedObject = null;
        }

        function updateMaterial() {
            if (!selectedObject) return;
            const color = document.getElementById('mat-color').value;
            const roughness = parseFloat(document.getElementById('mat-roughness').value);
            const metalness = parseFloat(document.getElementById('mat-metalness').value);

            document.getElementById('val-roughness').innerText = roughness;
            document.getElementById('val-metalness').innerText = metalness;

            selectedObject.traverse((child) => {
                if (child.isMesh && child.material) {
                    child.material.color.set(color);
                    child.material.roughness = roughness;
                    child.material.metalness = metalness;
                }
            });
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // --- Export Engine ---
        function exportDesign() {
            if (objects.length === 0) return alert('Scene is empty!');
            const format = document.getElementById('export-format').value;
            const targetNode = selectedObject || scene;

            if (format === 'obj') {
                const exporter = new THREE.OBJExporter();
                downloadFile(exporter.parse(targetNode), 'design.obj', 'text/plain');
            } else if (format === 'stl') {
                const exporter = new THREE.STLExporter();
                downloadFile(exporter.parse(targetNode, { binary: true }), 'design.stl', 'application/octet-stream');
            } else if (format === 'glb') {
                const exporter = new THREE.GLTFExporter();
                exporter.parse(targetNode, (glb) => {
                    downloadFile(glb, 'design.glb', 'application/octet-stream');
                }, { binary: true });
            }
        }

        function downloadFile(data, filename, mimeType) {
            const blob = new Blob([data], { type: mimeType });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function onWindowResize() {
            const viewport = document.getElementById('viewport');
            camera.aspect = viewport.clientWidth / viewport.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
