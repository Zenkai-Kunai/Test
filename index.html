<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Topology Generator</title>
    <style>
        /* Vanilla CSS */
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            resize: vertical;
            font-family: monospace;
            font-size: 12px;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #canvas-container {
            flex-grow: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        .node-component { fill: #ef4444; }
        .node-net { fill: #3b82f6; }
        .link { stroke: #cbd5e1; stroke-width: 1.5px; }
        .label { font-size: 10px; fill: #0f172a; pointer-events: none; }
        
        /* Print Styles to ensure clean PDF export */
        @media print {
            body { padding: 0; background: white; }
            .no-print { display: none !important; }
            #canvas-container { border: none; height: 100vh; width: 100vw; }
            svg { width: 100%; height: 100%; }
        }
    </style>
</head>
<body>

    <div class="header no-print">
        <h2>Auto Circuit Topology Visualizer</h2>
        <p>Paste the board configuration text below. The parser looks for the <strong>CONNECTIONS</strong> block to build the network.</p>
        <textarea id="boardData" placeholder="Paste Agilent 3070 board file here..."></textarea>
    </div>

    <div class="controls no-print">
        <button onclick="generateDiagram()">Generate Diagram</button>
        <button onclick="window.print()" style="background: #10b981;">Download Searchable PDF</button>
    </div>

    <div id="canvas-container">
        <svg id="circuitSvg"></svg>
    </div>

    <script>
        // Vanilla JS Physics & Parsing Engine
        let nodes = [];
        let edges = [];

        function parseBoardFile(text) {
            nodes = [];
            edges = [];
            const nodeMap = new Map();

            function addNode(id, type) {
                if (!nodeMap.has(id)) {
                    const node = { id, type, x: Math.random() * 800, y: Math.random() * 600, vx: 0, vy: 0 };
                    nodes.push(node);
                    nodeMap.set(id, node);
                }
                return nodeMap.get(id);
            }

            // Isolate the CONNECTIONS section
            const connSection = text.split(/CONNECTIONS/i)[1];
            if (!connSection) {
                alert("Could not find CONNECTIONS section in the text.");
                return;
            }
            
            // Extract until the next major section (usually DEVICES or END)
            const connectionsText = connSection.split(/(DEVICES|END)/i)[0];
            
            // Parse logic: Nets are un-indented or single-indented, parts are double-indented
            const lines = connectionsText.split('\n');
            let currentNet = null;

            lines.forEach(line => {
                // Remove comments and trim right
                let cleanLine = line.split('!')[0].trimRight();
                if (!cleanLine.trim()) return;

                // Detect if it's a net name (starts with minimal whitespace)
                const leadingSpaces = cleanLine.length - cleanLine.trimLeft().length;
                
                if (leadingSpaces < 4 && cleanLine.trim() !== '') {
                    currentNet = cleanLine.trim();
                    addNode(currentNet, 'net');
                } else if (leadingSpaces >= 4 && currentNet) {
                    // Extract component name (e.g., C18.2 -> C18)
                    let componentPart = cleanLine.trim().split('.')[0];
                    // Clean up semicolons
                    componentPart = componentPart.replace(';', '');
                    
                    if (componentPart) {
                        addNode(componentPart, 'component');
                        edges.push({
                            source: currentNet,
                            target: componentPart
                        });
                    }
                }
            });
        }

        function generateDiagram() {
            const text = document.getElementById('boardData').value;
            if (!text.trim()) {
                alert("Please paste the board file data first.");
                return;
            }

            parseBoardFile(text);
            runPhysicsLayout();
            renderSVG();
        }

        function runPhysicsLayout() {
            // Simple Force-Directed Graph implementation (Fruchterman-Reingold inspired)
            const iterations = 150;
            const k = 50; // Optimal distance
            const width = document.getElementById('canvas-container').clientWidth;
            const height = document.getElementById('canvas-container').clientHeight;

            // Pre-map node indices for faster edge lookups
            const nodeDict = {};
            nodes.forEach(n => nodeDict[n.id] = n);

            // Center nodes initially
            nodes.forEach(n => {
                n.x = width / 2 + (Math.random() - 0.5) * 200;
                n.y = height / 2 + (Math.random() - 0.5) * 200;
            });

            for (let iter = 0; iter < iterations; iter++) {
                // Calculate Repulsive forces
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        let dx = nodes[i].x - nodes[j].x;
                        let dy = nodes[i].y - nodes[j].y;
                        let distSq = dx*dx + dy*dy;
                        if (distSq === 0) distSq = 0.01;
                        if (distSq < 10000) { 
                            let force = (k * k) / distSq;
                            let fx = force * dx;
                            let fy = force * dy;
                            nodes[i].vx += fx;
                            nodes[i].vy += fy;
                            nodes[j].vx -= fx;
                            nodes[j].vy -= fy;
                        }
                    }
                }

                // Calculate Attractive forces
                edges.forEach(edge => {
                    let source = nodeDict[edge.source];
                    let target = nodeDict[edge.target];
                    if(!source || !target) return;
                    let dx = target.x - source.x;
                    let dy = target.y - source.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist === 0) dist = 0.01;
                    let force = (dist * dist) / k;
                    let fx = (force * dx) / dist;
                    let fy = (force * dy) / dist;
                    
                    // Net nodes are heavier (move less) to create better clustering
                    let sourceWeight = source.type === 'net' ? 0.2 : 0.8;
                    let targetWeight = target.type === 'net' ? 0.2 : 0.8;

                    source.vx += fx * sourceWeight;
                    source.vy += fy * sourceWeight;
                    target.vx -= fx * targetWeight;
                    target.vy -= fy * targetWeight;
                });

                // Apply velocity, friction, and bounds
                const temp = iter / iterations; // Cooling schedule
                const maxDisplacement = temp * 20 + 1;

                nodes.forEach(n => {
                    let vDist = Math.sqrt(n.vx*n.vx + n.vy*n.vy);
                    if (vDist > 0) {
                        let dispX = (n.vx / vDist) * Math.min(vDist, maxDisplacement);
                        let dispY = (n.vy / vDist) * Math.min(vDist, maxDisplacement);
                        n.x += dispX;
                        n.y += dispY;
                    }
                    // Keep within bounds
                    n.x = Math.max(20, Math.min(width - 20, n.x));
                    n.y = Math.max(20, Math.min(height - 20, n.y));
                    
                    // Reset velocity
                    n.vx = 0;
                    n.vy = 0;
                });
            }
        }

        function renderSVG() {
            const svg = document.getElementById('circuitSvg');
            svg.innerHTML = ''; // Clear previous

            const nodeDict = {};
            nodes.forEach(n => nodeDict[n.id] = n);

            // Draw Edges
            edges.forEach(edge => {
                let source = nodeDict[edge.source];
                let target = nodeDict[edge.target];
                if(source && target) {
                    let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', source.x);
                    line.setAttribute('y1', source.y);
                    line.setAttribute('x2', target.x);
                    line.setAttribute('y2', target.y);
                    line.setAttribute('class', 'link');
                    svg.appendChild(line);
                }
            });

            // Draw Nodes
            nodes.forEach(n => {
                let circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', n.x);
                circle.setAttribute('cy', n.y);
                circle.setAttribute('r', n.type === 'net' ? 6 : 4);
                circle.setAttribute('class', n.type === 'net' ? 'node-net' : 'node-component');
                svg.appendChild(circle);

                // Draw Text (Searchable in PDF)
                let text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', n.x + 8);
                text.setAttribute('y', n.y + 3);
                text.setAttribute('class', 'label');
                text.textContent = n.id;
                svg.appendChild(text);
            });
        }
    </script>
</body>
</html>
