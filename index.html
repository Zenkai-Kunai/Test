<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web CAD Studio & Measuring Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #121212; color: #e0e0e0; overflow: hidden; display: flex; height: 100vh; width: 100vw; }
        #app-container { display: flex; width: 100%; height: 100%; position: relative; }
        #viewport { flex-grow: 1; height: 100%; position: relative; }
        #canvas3d { width: 100%; height: 100%; display: block; }
        
        #sidebar {
            width: 340px; background: #1e1e1e; border-left: 1px solid #333;
            display: flex; flex-direction: column; gap: 10px; padding: 12px;
            overflow-y: auto; z-index: 10; transition: transform 0.3s ease;
        }

        .panel-section { background: #161616; border: 1px solid #2d2d2d; border-radius: 6px; padding: 10px; }
        .panel-title { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #3b82f6; margin-bottom: 8px; border-bottom: 1px solid #2d2d2d; padding-bottom: 4px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
        .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }

        label { font-size: 11px; color: #aaa; display: flex; justify-content: space-between; }
        input, select, button { background: #2a2a2a; color: #fff; border: 1px solid #3d3d3d; padding: 6px; border-radius: 4px; font-size: 12px; outline: none; }
        input[type="number"] { width: 100%; }
        input[type="color"] { height: 32px; width: 100%; padding: 0; cursor: pointer; }
        
        button { background: #2563eb; cursor: pointer; font-weight: 600; border: none; min-height: 32px; }
        button:active { opacity: 0.8; }
        button.active { background: #059669 !important; }
        button.danger { background: #dc2626; }
        button.secondary { background: #374151; }

        #toolbar {
            position: absolute; top: 10px; left: 10px; background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(5px); border: 1px solid #333; padding: 4px; border-radius: 6px; display: flex; gap: 4px; z-index: 5;
        }
        .tool-btn { padding: 6px 10px; font-size: 11px; background: transparent; }
        .tool-btn.active { background: #2563eb; }

        #measure-badge {
            position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.85);
            border: 1px solid #3b82f6; padding: 8px 14px; border-radius: 6px; font-family: monospace; font-size: 13px; color: #60a5fa; pointer-events: none;
        }
        #mobile-toggle { display: none; position: absolute; top: 10px; right: 10px; z-index: 20; background: #2563eb; }

        @media (max-width: 768px) {
            #mobile-toggle { display: block; }
            #sidebar { position: absolute; bottom: 0; left: 0; width: 100%; max-height: 50vh; border-radius: 12px 12px 0 0; transform: translateY(100%); }
            #sidebar.open { transform: translateY(0); }
        }
    </style>
    <!-- Three.js + Extensions + CSG Boolean Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
    <script src="https://unpkg.com/three-csg-ts@3.1.11/single/three-csg.js"></script>
</head>
<body>

    <div id="app-container">
        <button id="mobile-toggle" onclick="toggleSidebar()">⚙️ CAD Panel</button>
        <div id="viewport">
            <div id="toolbar">
                <button class="tool-btn active" id="mode-translate" onclick="setTransformMode('translate')">Move</button>
                <button class="tool-btn" id="mode-rotate" onclick="setTransformMode('rotate')">Rotate</button>
                <button class="tool-btn" id="mode-scale" onclick="setTransformMode('scale')">Scale</button>
                <button class="tool-btn" id="mode-measure" onclick="toggleMeasureMode()">📏 Measure</button>
            </div>
            <div id="measure-badge">Distance: 0.00 mm</div>
            <canvas id="canvas3d"></canvas>
        </div>

        <div id="sidebar">
            <!-- Camera Presets -->
            <div class="panel-section">
                <div class="panel-title">Standard Views</div>
                <div class="row-3">
                    <button class="secondary" onclick="setView('top')">Top</button>
                    <button class="secondary" onclick="setView('front')">Front</button>
                    <button class="secondary" onclick="setView('right')">Right</button>
                </div>
            </div>

            <!-- Precision Numerical Inputs -->
            <div class="panel-section">
                <div class="panel-title">Precision Transforms (mm)</div>
                <div class="control-group">
                    <label>Position X / Y / Z</label>
                    <div class="row-3">
                        <input type="number" id="pos-x" step="0.1" onchange="applyTransformInput()">
                        <input type="number" id="pos-y" step="0.1" onchange="applyTransformInput()">
                        <input type="number" id="pos-z" step="0.1" onchange="applyTransformInput()">
                    </div>
                </div>
                <div class="control-group">
                    <label>Bounding Dimensions (LxWxH)</label>
                    <div class="row-3">
                        <input type="text" id="dim-x" readonly style="opacity:0.6;">
                        <input type="text" id="dim-y" readonly style="opacity:0.6;">
                        <input type="text" id="dim-z" readonly style="opacity:0.6;">
                    </div>
                </div>
            </div>

            <!-- CAD Booleans (Extrude/Subtract) -->
            <div class="panel-section">
                <div class="panel-title">Solid Operations (Select 2 Meshes)</div>
                <div class="btn-grid">
                    <button class="secondary" onclick="performCSG('subtract')">Extrude Cut (-)</button>
                    <button class="secondary" onclick="performCSG('union')">Combine (+)</button>
                </div>
            </div>

            <!-- Import/Primitives -->
            <div class="panel-section">
                <div class="panel-title">Primitives & Files</div>
                <div class="btn-grid" style="margin-bottom:6px;">
                    <button onclick="addCube()">Cube</button>
                    <button onclick="addCylinder()">Cylinder</button>
                </div>
                <input type="file" id="file-input" accept=".obj,.stl" style="display:none;" onchange="handleFileUpload(event)">
                <button class="secondary" style="width:100%;" onclick="document.getElementById('file-input').click()">Import STL/OBJ Scan</button>
            </div>

            <!-- Material & Export -->
            <div class="panel-section">
                <div class="panel-title">Export CAD Data</div>
                <div class="btn-grid">
                    <button class="danger" onclick="deleteSelected()">Delete</button>
                    <button onclick="exportSTL()">Download STL</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, orbitControls, transformControls;
        let selectedObject = null, selectedObjectsGroup = [];
        let isMeasuring = false, measurePoints = [], measureLine = null;
        const objects = [];

        init();
        animate();

        function init() {
            const viewport = document.getElementById('viewport');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);

            const gridHelper = new THREE.GridHelper(50, 50, 0x3b82f6, 0x333333);
            scene.add(gridHelper);

            camera = new THREE.PerspectiveCamera(50, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
            camera.position.set(10, 10, 10);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(20, 40, 20);
            scene.add(sun);

            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;

            transformControls = new THREE.TransformControls(camera, renderer.domElement);
            scene.add(transformControls);
            transformControls.addEventListener('dragging-changed', (e) => orbitControls.enabled = !e.value);
            transformControls.addEventListener('change', updateTransformUI);

            // Selection & Measurement Raycasting
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            renderer.domElement.addEventListener('pointerdown', (e) => {
                if (transformControls.dragging) return;
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

                if (isMeasuring) {
                    const intersects = raycaster.intersectObjects(objects, true);
                    if (intersects.length > 0) handleMeasurementPoint(intersects[0].point);
                    return;
                }

                const intersects = raycaster.intersectObjects(objects, true);
                if (intersects.length > 0) {
                    let hitObj = intersects[0].object;
                    while (hitObj.parent && hitObj.parent !== scene) hitObj = hitObj.parent;
                    
                    if (e.shiftKey) {
                        toggleMultiSelect(hitObj);
                    } else {
                        selectedObjectsGroup = [hitObj];
                        selectObject(hitObj);
                    }
                }
            });

            window.addEventListener('resize', onWindowResize);
            addCube();
        }

        // --- Standard Views ---
        function setView(view) {
            if (view === 'top') camera.position.set(0, 20, 0);
            if (view === 'front') camera.position.set(0, 0, 20);
            if (view === 'right') camera.position.set(20, 0, 0);
            camera.lookAt(0, 0, 0);
        }

        // --- Distance Measurement Engine ---
        function toggleMeasureMode() {
            isMeasuring = !isMeasuring;
            document.getElementById('mode-measure').classList.toggle('active', isMeasuring);
            measurePoints = [];
            if (measureLine) scene.remove(measureLine);
        }

        function handleMeasurementPoint(point) {
            measurePoints.push(point);
            if (measurePoints.length === 2) {
                const p1 = measurePoints[0], p2 = measurePoints[1];
                const distance = p1.distanceTo(p2).toFixed(2);
                document.getElementById('measure-badge').innerText = `Distance: ${distance} mm`;

                const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                const mat = new THREE.LineBasicMaterial({ color: 0x60a5fa, linewidth: 3 });
                if (measureLine) scene.remove(measureLine);
                measureLine = new THREE.Line(geom, mat);
                scene.add(measureLine);

                measurePoints = []; // Reset for next reading
            }
        }

        // --- Precision Transformations UI Sync ---
        function updateTransformUI() {
            if (!selectedObject) return;
            document.getElementById('pos-x').value = selectedObject.position.x.toFixed(2);
            document.getElementById('pos-y').value = selectedObject.position.y.toFixed(2);
            document.getElementById('pos-z').value = selectedObject.position.z.toFixed(2);

            const box = new THREE.Box3().setFromObject(selectedObject);
            const size = box.getSize(new THREE.Vector3());
            document.getElementById('dim-x').value = size.x.toFixed(2);
            document.getElementById('dim-y').value = size.y.toFixed(2);
            document.getElementById('dim-z').value = size.z.toFixed(2);
        }

        function applyTransformInput() {
            if (!selectedObject) return;
            selectedObject.position.x = parseFloat(document.getElementById('pos-x').value) || 0;
            selectedObject.position.y = parseFloat(document.getElementById('pos-y').value) || 0;
            selectedObject.position.z = parseFloat(document.getElementById('pos-z').value) || 0;
        }

        // --- Solid CSG Engine (Boolean Extrude Cut / Join) ---
        function performCSG(operation) {
            if (selectedObjectsGroup.length < 2) {
                alert("Hold SHIFT and select 2 overlapping objects to perform a Boolean operation.");
                return;
            }
            const meshA = selectedObjectsGroup[0];
            const meshB = selectedObjectsGroup[1];

            try {
                const csgA = THREEloaderCSG.CSG.fromMesh(meshA);
                const csgB = THREEloaderCSG.CSG.fromMesh(meshB);
                let resultCSG;

                if (operation === 'subtract') resultCSG = csgA.subtract(csgB);
                if (operation === 'union') resultCSG = csgA.union(csgB);

                const resultMesh = THREEloaderCSG.CSG.toMesh(resultCSG, meshA.matrix, meshA.material);
                
                scene.remove(meshA); scene.remove(meshB);
                objects.splice(objects.indexOf(meshA), 1);
                objects.splice(objects.indexOf(meshB), 1);

                scene.add(resultMesh);
                objects.push(resultMesh);
                selectedObjectsGroup = [];
                selectObject(resultMesh);
            } catch (err) {
                alert("CSG Boolean failed on geometry. Make sure objects overlap completely.");
            }
        }

        // --- Scene Management & Primitives ---
        function createMesh(geometry) {
            const mat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.3, metalness: 0.1 });
            const mesh = new THREE.Mesh(geometry, mat);
            mesh.position.y = 1;
            scene.add(mesh);
            objects.push(mesh);
            selectObject(mesh);
        }

        function addCube() { createMesh(new THREE.BoxGeometry(2, 2, 2)); }
        function addCylinder() { createMesh(new THREE.CylinderGeometry(1, 1, 3, 32)); }

        function selectObject(obj) {
            selectedObject = obj;
            if (obj) { transformControls.attach(obj); updateTransformUI(); }
            else { transformControls.detach(); }
        }

        function toggleMultiSelect(obj) {
            const idx = selectedObjectsGroup.indexOf(obj);
            if (idx > -1) selectedObjectsGroup.splice(idx, 1);
            else selectedObjectsGroup.push(obj);
            selectObject(obj);
        }

        function deleteSelected() {
            if (!selectedObject) return;
            transformControls.detach();
            scene.remove(selectedObject);
            objects.splice(objects.indexOf(selectedObject), 1);
            selectedObject = null;
        }

        function setTransformMode(m) {
            transformControls.setMode(m);
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`mode-${m}`).classList.add('active');
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function onWindowResize() {
            const vp = document.getElementById('viewport');
            camera.aspect = vp.clientWidth / vp.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(vp.clientWidth, vp.clientHeight);
        }
        function animate() { requestAnimationFrame(animate); orbitControls.update(); renderer.render(scene, camera); }
        function exportSTL() {
            const exporter = new THREE.STLExporter();
            const blob = new Blob([exporter.parse(selectedObject || scene, { binary: true })], { type: 'application/octet-stream' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cad_model.stl'; a.click();
        }
    </script>
</body>
</html>
